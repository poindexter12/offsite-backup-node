# offsite-backup-node — self-contained offsite restic backup target,
# ONE image / ONE container (tailscale + rest-server + alloy + shaper,
# supervised by entrypoint.sh; see Dockerfile).
#
# Ships as a folder: this file + .env (the image comes prebuilt from GHCR).
# Run: docker compose up -d
#
# Mount model: ONE config root (CONFIG_ROOT, default ./config — per-component
# subdirs) + ONE data mount (DATA_PATH, the backup disk). Nothing else touches
# the host.
#
# Network model: private by construction — no `ports:`, so nothing listens on
# the LAN. Inbound arrives only via Tailscale serve inside the tailnet; the
# docker bridge is outbound-only (tailscaled needs egress to the coordination
# servers, so the network cannot be `internal: true`).
#
# Updates: CI rebuilds and publishes the image whenever an upstream
# (tailscale, rest-server, alloy, debian base) releases — the box just runs
# `docker compose pull && docker compose up -d` (cron-able; see README).
# config/tailscaled survives updates — the node never re-enrolls; TS_AUTHKEY
# only matters on first boot.

services:
  offsite-backup:
    image: ghcr.io/poindexter12/offsite-backup-node:latest
    # For development: `docker compose up -d --build` builds locally instead.
    build: .
    hostname: ${OFFSITE_HOSTNAME:-offsite-backup}
    # NET_ADMIN is only for the tc bandwidth cap (entrypoint shapes eth0);
    # tailscaled runs in userspace mode and needs nothing special.
    cap_add:
      - NET_ADMIN
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Optional: point at a self-hosted control server (headscale). Empty =
      # Tailscale SaaS.
      TS_EXTRA_ARGS: ${TS_LOGIN_SERVER:+--login-server=${TS_LOGIN_SERVER}}
      TS_HOSTNAME: ${OFFSITE_HOSTNAME:-offsite-backup}
      PROM_PUSH_URL: ${PROM_PUSH_URL}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
      MAX_UP_MBIT: ${MAX_UP_MBIT:-0}
      MAX_DOWN_MBIT: ${MAX_DOWN_MBIT:-0}
    volumes:
      - ${CONFIG_ROOT:-./config}/tailscaled:/var/lib/tailscale
      - ${CONFIG_ROOT:-./config}/restic:/config/restic:ro
      - ${CONFIG_ROOT:-./config}/alloy:/var/lib/alloy
      - ${DATA_PATH:?path to the backup disk/directory}:/data
    restart: unless-stopped
